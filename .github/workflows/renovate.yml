name: Renovate

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: codecaliper
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Run Renovate
        run: npx --yes --package renovate@44.198.3 renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.HOMELAB_RENOVATE }}
          RENOVATE_PLATFORM: github
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
          npm_config_fetch_retries: "0"
